name: Combined contribution graph

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          WORK_TOKEN: ${{ secrets.WORK_TOKEN }}
        run: |
          python scripts/combined_graph.py
          python scripts/profile_cards.py
      - name: Point README at the new image version (defeats image caching)
        run: |
          v=$(sha256sum combined-graph.svg | cut -c1-8)
          sed -i -E "s#combined-graph\.svg(\?v=[0-9a-f]+)?\"#combined-graph.svg?v=$v\"#" README.md
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add combined-graph.svg overview.svg stats.svg README.md
          git diff --staged --quiet || git commit -m "Update combined contribution graph"
          git push
